# Lance Brèche avec une base PostgreSQL : docker compose up -d --build
# Les variables viennent du fichier .env (copie .env.example).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: breche
      POSTGRES_USER: breche
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?définis POSTGRES_PASSWORD dans .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U breche"]
      interval: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://breche:${POSTGRES_PASSWORD}@db:5432/breche
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - media:/data/media

  # Facultatif : expose le site via un tunnel Cloudflare, sans ouvrir de port sur ta box.
  # Activation : docker compose --profile tunnel up -d
  tunnel:
    image: cloudflare/cloudflared:2024.12.2
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - web
    profiles: ["tunnel"]

volumes:
  pgdata:
  media:
